packages:
  - apps/*
  - packages/*

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - '@markmend/core@2.1.0'
  - '@markmend/parser@2.1.0'
  - '@stream-markdown/code@2.1.0'
  - '@stream-markdown/core@2.1.0'
  - '@stream-markdown/math@2.1.0'
  - '@stream-markdown/mermaid@2.1.0'
  - vue-stream-markdown@2.1.0
